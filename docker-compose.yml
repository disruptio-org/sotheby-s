services:
  db:
    image: postgres:16-alpine
    container_name: sothebys-back-office-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: backoffice
      POSTGRES_PASSWORD: backoffice
      POSTGRES_DB: backoffice
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backoffice -d backoffice']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:

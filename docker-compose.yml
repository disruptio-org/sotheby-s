services:
  db:
    image: postgres:16-alpine
    container_name: sothebys-back-office-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: backoffice
      POSTGRES_PASSWORD: backoffice
      POSTGRES_DB: backoffice
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backoffice -d backoffice']
      interval: 5s
      timeout: 5s
      retries: 10

  # Development mail catcher: nothing ever leaves the machine. SMTP on 1025,
  # the inbox at http://localhost:8025.
  mail:
    image: axllent/mailpit:latest
    container_name: sothebys-back-office-mail
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db-data:
